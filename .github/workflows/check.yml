# CUSTOMIZE: Fork / Clone 先のリポジトリでは `jobs.check.if` の条件で発動を停止します。
# 自分のプロジェクトで CI を有効化したい場合は、この if 行を削除してください。

name: check

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*'

jobs:
  check:
    if: github.repository == 'mflocss/starter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check (format + lint)
        run: npm run check

      - name: Build
        run: npm run build
