# CUSTOMIZE: Fork / Clone 先のリポジトリでは `jobs.check.if` の条件で発動を停止します。
# 自分のプロジェクトで CI を有効化したい場合は、この if 行を削除してください。

name: check

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*'

jobs:
  check:
    if: github.repository == 'mflocss/starter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # pnpm v10 系の `pnpm audit` は npm レジストリが廃止した legacy audit endpoint
        # （/-/npm/v1/security/audits[/quick]、2026-07-15 廃止）を呼ぶため 410 で失敗する
        # （pnpm/pnpm#13033、公式トリアージ済み: pnpm v11 で新 bulk advisory endpoint に移行済み）。
        # インストール/ビルドの主系統は pnpm v10 のまま維持し、audit だけ `pnpm dlx` で
        # pnpm v11 を一時的に呼び出す（公式ワークアラウンド `pnx pnpm@latest-11 audit` に準拠）。
        run: pnpm dlx pnpm@11 audit --audit-level high

      - name: Run check (format + lint)
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Build (サブディレクトリ配信)
        # base-anchor-href plugin は既定の base では何もしないため、既定ビルドだけでは
        # `<a href>` を書き換える経路が一度も実行されない。base を変えたビルドをここで通す。
        # 出力先を分けるのは、既定ビルドの dist を上書きしないため。
        run: |
          # `--` は pnpm がそのまま vite へ渡し、vite の CLI パーサが以降を解釈しないので付けない
          pnpm run build --base=/sub/ --outDir ../dist-sub
          grep -q 'href="/sub/#features"' dist-sub/index.html
          grep -q 'href="/sub/privacy/"' dist-sub/index.html
          grep -q 'href="/sub/#features"' dist-sub/404.html
          # 相対 base ではルート絶対パスの href を解決できないので、意図した理由で止まることを確かめる
          if pnpm run build --base=./ --outDir ../dist-rel > rel.log 2>&1; then
            echo '相対 base のビルドが止まらなかった' >&2
            exit 1
          fi
          grep -q 'ルート絶対パスの href は解決できません' rel.log
