# pnpm の設定ファイル（npm / yarn は読みません）。要 pnpm 10.5.1 以降。
#
# 🔴 pnpm 10.4.1 以前 / pnpm 9 は `packages:` が無いため
#    `ERROR packages field missing or empty` で止まります。
#    **`packages:` を足して回避しないでください** — install は通るようになりますが、
#    下の overrides が黙って外れ、対策済みの advisory が戻ります。pnpm 自体を上げてください。

# 推移的依存の advisory 対応。npm 利用者向けの package.json `overrides` と同一内容に保つこと
# （追加・剪定の手順は CODING_GUIDE「脆弱性 pin」）。
overrides:
  # floor 版が直接依存より新しいため、dry-run が「冗長」と出ても残す（CODING_GUIDE「剪定 policy」の例外）
  image-size: '>=2.0.3 <3'

# minimumReleaseAge（公開直後のパッケージを避ける安全機能）の除外リスト。
# rolldown（vite の依存）が高頻度リリースのため、有効にしている環境で毎回引っかかる。
# 有効にしていない環境では no-op。リリース間隔が延びるか vite が rolldown 依存をやめたら削除できる。
# 🔴 rolldown を更新したらこのリストを手で直さず再生成して貼り替えること
#    （コマンドは CODING_GUIDE「pnpm 設定のメンテナンス」）。
minimumReleaseAgeExclude:
  - '@oxc-project/types'
  - '@rolldown/binding-android-arm-eabi'
  - '@rolldown/binding-android-arm64'
  - '@rolldown/binding-darwin-arm64'
  - '@rolldown/binding-darwin-x64'
  - '@rolldown/binding-freebsd-x64'
  - '@rolldown/binding-linux-arm-gnueabihf'
  - '@rolldown/binding-linux-arm64-gnu'
  - '@rolldown/binding-linux-arm64-musl'
  - '@rolldown/binding-linux-ppc64-gnu'
  - '@rolldown/binding-linux-s390x-gnu'
  - '@rolldown/binding-linux-x64-gnu'
  - '@rolldown/binding-linux-x64-musl'
  - '@rolldown/binding-openharmony-arm64'
  - '@rolldown/binding-win32-arm64-msvc'
  - '@rolldown/binding-win32-x64-msvc'
  - '@rolldown/pluginutils'
  - 'rolldown'
